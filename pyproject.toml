[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "material-library"
version = "0.1.0"
description = "Local AI video material library with virtual clip indexing"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pillow>=10",
  "numpy>=1.26",
  "scenedetect>=0.6.5,<0.8",
  "opencv-python-headless>=4.8,<5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
material-library = "material_library.cli:main"

[tool.setuptools]
packages = ["material_library"]
